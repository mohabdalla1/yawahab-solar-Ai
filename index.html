<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وكيل الذكاء الاصطناعي الذكي</title>
  <style>
    body { font-family: sans-serif; background: #f4f6f8; padding: 15px; direction: rtl; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { color: #0d6efd; margin-top: 0; }
    textarea { width: 100%; border: 1px solid #ccc; border-radius: 8px; padding: 10px; font-size: 16px; box-sizing: border-box; }
    button { width: 100%; background: #0d6efd; color: white; border: none; padding: 14px; font-size: 18px; border-radius: 8px; margin-top: 10px; font-weight: bold; }
    .response { background: #e9ecef; border-right: 4px solid #0d6efd; padding: 15px; margin-top: 15px; border-radius: 6px; white-space: pre-line; }
    .loading { text-align: center; color: #0d6efd; font-weight: bold; display: none; margin-top: 10px; }
  </style>
</head>
<body>

<div class="card">
  <h2>وكيل الذكاء الاصطناعي (AI Agent) 🤖</h2>
  <label>اكتب للوكيل ما تريد تحليله أو اتخاذ قرار فيه:</label>
  <textarea id="prompt" rows="4" placeholder="مثال: قم بتحليل متطلبات تشغيل محرك 10 حصان بواسطة إنفرتر..."></textarea>
  <button onclick="askAgent()">تشغيل الوكيل الذكي</button>
  <div id="loading" class="loading">⏳ جاري المعالجة بواسطة الوكيل...</div>
  <div id="output" class="response" style="display:none;"></div>
</div>

<script>
// ضع مفتاح Gemini API المجاني الخاص بك هنا بين التنصيص
const API_KEY = "ضع_مفتاح_API_المجاني_هنا";

async function askAgent() {
  const userInput = document.getElementById('prompt').value;
  const loading = document.getElementById('loading');
  const output = document.getElementById('output');

  if (!userInput) return alert("يرجى كتابة الطلب أولاً");

  loading.style.display = "block";
  output.style.display = "none";

  // تعليمات الوكيل الذكي
  const systemPrompt = "أنت وكيل ذكاء اصطناعي خبير ومتخصص في التحليل الهندسي، اتخاذ القرارات، وتقديم الحلول المباشرة المنظمة بنقاط واضحة.";

  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ role: 'user', parts: [{ text: `${systemPrompt}\n\nطلب المستخدم:\n${userInput}` }] }]
      })
    });

    const data = await res.json();
    loading.style.display = "none";

    if (data.candidates && data.candidates[0].content.parts[0].text) {
      output.innerText = data.candidates[0].content.parts[0].text;
      output.style.display = "block";
    } else {
      alert("حدث خطأ، تأكد من صحة المفتاح.");
    }
  } catch (e) {
    loading.style.display = "none";
    alert("تعذر الاتصال بالشبكة.");
  }
}
</script>

</body>
</html>
