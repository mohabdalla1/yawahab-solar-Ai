<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة منظومات الطاقة الشمسية المتوازنة</title>
  <!-- مكتبة html2pdf لتوليد ملفات PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --primary-color: #0d6efd;
      --secondary-color: #198754;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --border-color: #dee2e6;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #0f5132;
      margin-bottom: 25px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 16px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #0b5ed7;
    }

    .btn-pdf {
      background-color: var(--secondary-color);
    }

    .btn-pdf:hover {
      background-color: #157347;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .result-item {
      background-color: #e9ecef;
      padding: 15px;
      border-radius: 8px;
      border-right: 5px solid var(--primary-color);
    }

    .result-item.highlight {
      border-right-color: var(--secondary-color);
      background-color: #d1e7dd;
    }

    .result-title {
      font-size: 14px;
      color: #6c757d;
      margin-bottom: 5px;
    }

    .result-value {
      font-size: 20px;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    /* تنسيق الحاوية المخصصة للتصدير إلى PDF */
    #pdfPrintArea {
      padding: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>حاسبة تصميم المنظومات الشمسية المتوازنة</h1>

  <div class="card">
    <div class="form-group">
      <label for="runningLoad">الحمل التشغيلي المباشر (واط - W):</label>
      <input type="number" id="runningLoad" value="1660" placeholder="مثال: 1660">
    </div>

    <div class="form-group">
      <label for="nightHours">ساعات التشغيل الليلية (من البطارية فقط):</label>
      <input type="number" id="nightHours" value="6" placeholder="مثال: 6">
    </div>

    <div class="form-group">
      <label for="sunHours">ساعات ذروة الشمس اليومية (ساعة):</label>
      <input type="number" id="sunHours" value="5" step="0.5" placeholder="مثال: 5">
    </div>

    <div class="form-group">
      <label for="panelWattage">قدرة اللوح الشمسي (واط):</label>
      <select id="panelWattage">
        <option value="585" selected>585W</option>
        <option value="550">550W</option>
        <option value="600">600W</option>
      </select>
    </div>

    <button onclick="processCalculation()">حساب المنظومة المتوازنة</button>
  </div>

  <div id="outputCard" class="card hidden">
    <div id="pdfPrintArea">
      <h2>التقرير الهندسي الموصى به للمنظومة</h2>
      <hr style="border: 0; border-top: 1px solid var(--border-color); margin-bottom: 15px;">
      
      <div class="results-grid">
        <div class="result-item highlight">
          <div class="result-title">جهد النظام الموصى به</div>
          <div class="result-value" id="resVoltage">-</div>
        </div>
        <div class="result-item highlight">
          <div class="result-title">سعة الإنفرتر المناسب</div>
          <div class="result-value" id="resInverter">-</div>
        </div>
        <div class="result-item">
          <div class="result-title">سعة البطارية المطلوبة (kWh)</div>
          <div class="result-value" id="resBatteryKWh">-</div>
        </div>
        <div class="result-item">
          <div class="result-title">السعة بالأمبير/ساعة (Ah)</div>
          <div class="result-value" id="resBatteryAh">-</div>
        </div>
        <div class="result-item">
          <div class="result-title">إجمالي قدرة الألواح</div>
          <div class="result-value" id="resPvPower">-</div>
        </div>
        <div class="result-item">
          <div class="result-title">عدد الألواح المطلوبة</div>
          <div class="result-value" id="resPanelCount">-</div>
        </div>
        <div class="result-item">
          <div class="result-title">تيار شحن البطارية الأقصى</div>
          <div class="result-value" id="resChargeCurrent">-</div>
        </div>
        <div class="result-item">
          <div class="result-title">الاستهلاك الليلي المتوقع</div>
          <div class="result-value" id="resNightEnergy">-</div>
        </div>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn-pdf" onclick="generatePDF()">تصدير التقرير PDF</button>
    </div>
  </div>
</div>

<script>
/**
 * المحرك الهندسي لحساب المكونات بشكل متوازن
 */
function calculateBalancedSolarSystem(runningLoadW, nightHours, sunHours, panelWattage) {
  // 1. المعاملات والكفاءات
  const inverterEfficiency = 0.90;   // كفاءة الانفيرتر
  const batteryDoD = 0.85;           // عمق تفريغ الليثيوم (85%)
  const batteryChargingLoss = 1.15;   // مفقودات الشحن (15%)
  const safetyFactor = 1.25;         // معامل أمان الأحمال

  // 2. تحديد جهد النظام والإنفرتر تلقائياً بمرونة هندسية
  let systemVoltage = 24;
  let recommendedInverterKw = 3.5;

  if (runningLoadW > 2500) {
    systemVoltage = 48;
    recommendedInverterKw = Math.ceil((runningLoadW * safetyFactor) / 1000);
    if (recommendedInverterKw < 5) recommendedInverterKw = 5;
  } else if (runningLoadW > 1500) {
    systemVoltage = 24;
    recommendedInverterKw = 3.5;
  } else {
    systemVoltage = 24;
    recommendedInverterKw = 2.0;
  }

  // 3. حساب سعة البطارية (مبنية على ساعات التشغيل الليلية فقط)
  const nightEnergyWh = (runningLoadW * nightHours) / inverterEfficiency;
  const requiredBatteryKWh = (nightEnergyWh / batteryDoD) / 1000;
  const requiredBatteryAh = (requiredBatteryKWh * 1000) / systemVoltage;

  // 4. حساب قدرة الألواح (شحن البطارية + الاستهلاك النهاري)
  const energyToRechargeBatteryWh = nightEnergyWh * batteryChargingLoss;
  const dayHours = Math.max(0, 12 - nightHours);
  const dayEnergyWh = (runningLoadW * dayHours) / inverterEfficiency;

  const totalDailyEnergyWhRequired = energyToRechargeBatteryWh + dayEnergyWh;
  
  // القدرة الواجب توفرها مع تعويض فاقد الحرارة والغبار (15%)
  const requiredPvPowerW = (totalDailyEnergyWhRequired / sunHours) * 1.15;

  // 5. حساب عدد الألواح
  const panelCount = Math.ceil(requiredPvPowerW / panelWattage);
  const actualPvPowerKW = (panelCount * panelWattage) / 1000;

  // 6. تيار الشحن الأقصى
  const maxChargeCurrent = Math.round((actualPvPowerKW * 1000) / systemVoltage);

  return {
    systemVoltage: systemVoltage + "V",
    inverterSize: recommendedInverterKw + " kW",
    batteryKWh: requiredBatteryKWh.toFixed(2) + " kWh",
    batteryAh: Math.round(requiredBatteryAh) + ` Ah (${systemVoltage}V)`,
    totalPvPowerKW: actualPvPowerKW.toFixed(2) + " kW",
    panelCount: panelCount + ` لوح (${panelWattage}W)`,
    maxChargeCurrent: maxChargeCurrent + " A",
    nightEnergyKWh: (nightEnergyWh / 1000).toFixed(2) + " kWh"
  };
}

/**
 * ربط الواجهة بالدالة البرمجية
 */
function processCalculation() {
  const runningLoad = parseFloat(document.getElementById('runningLoad').value) || 0;
  const nightHours = parseFloat(document.getElementById('nightHours').value) || 0;
  const sunHours = parseFloat(document.getElementById('sunHours').value) || 5;
  const panelWattage = parseFloat(document.getElementById('panelWattage').value) || 585;

  if (runningLoad <= 0 || nightHours < 0) {
    alert("يرجى إدخال قيم صحيحة للأحمال وساعات التشغيل.");
    return;
  }

  const result = calculateBalancedSolarSystem(runningLoad, nightHours, sunHours, panelWattage);

  // عرض النتائج في الصفحة
  document.getElementById('resVoltage').innerText = result.systemVoltage;
  document.getElementById('resInverter').innerText = result.inverterSize;
  document.getElementById('resBatteryKWh').innerText = result.batteryKWh;
  document.getElementById('resBatteryAh').innerText = result.batteryAh;
  document.getElementById('resPvPower').innerText = result.totalPvPowerKW;
  document.getElementById('resPanelCount').innerText = result.panelCount;
  document.getElementById('resChargeCurrent').innerText = result.maxChargeCurrent;
  document.getElementById('resNightEnergy').innerText = result.nightEnergyKWh;

  document.getElementById('outputCard').classList.remove('hidden');
}

/**
 * توليد وتصدير ملف الـ PDF
 */
function generatePDF() {
  const element = document.getElementById('pdfPrintArea');
  
  const options = {
    margin:       10,
    filename:     'تقرير_منظومة_طاقة_شمسية.pdf',
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2 },
    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };

  html2pdf().set(options).from(element).save();
}
</script>

</body>
</html>
