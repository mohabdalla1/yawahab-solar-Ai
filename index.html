<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YAWAHAB SOLAR AI - الوكيل الهندسي</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --primary: #0d6efd;
      --success: #198754;
      --bg: #f8f9fa;
      --card: #ffffff;
      --text: #212529;
      --border: #dee2e6;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    h1 {
      text-align: center;
      color: #0f5132;
      margin-top: 0;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      resize: vertical;
    }

    button {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    button:hover {
      background: #0b5ed7;
    }

    .loading {
      display: none;
      text-align: center;
      font-weight: bold;
      color: var(--primary);
      margin-top: 15px;
    }

    .response-area {
      background: #f1f3f5;
      padding: 20px;
      border-radius: 8px;
      border-right: 4px solid var(--primary);
      white-space: pre-line;
      line-height: 1.7;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>YAWAHAB SOLAR AI ☀️🤖</h1>
    <p style="text-align: center; color: #6c757d;">الوكيل الهندسي الذكي لتصميم وحساب منظومات الطاقة الشمسية</p>
    
    <div>
      <label for="userPrompt">أدخل الأحمال أو طلب العميل:</label>
      <textarea id="userPrompt" rows="5" placeholder="مثال: محتاج تشغيل مكيف 1.5 حصان لمدة 4 ساعات نهاراً، مع ثلاجة و6 لمبات ليلاً. ما هي المنظومة المناسبة والبطاريات والألواح؟"></textarea>
      <button onclick="runSolarAgent()">استشارة الوكيل الهندسي</button>
      <div id="loading" class="loading">⏳ جاري تحليل المنظومة وإعداد التقرير...</div>
    </div>
  </div>

  <div id="outputCard" class="card hidden">
    <div id="pdfPrintArea">
      <h2 style="color: #0f5132;">التقرير الهندسي الموصى به</h2>
      <hr style="border: 0; border-top: 1px solid var(--border); margin-bottom: 15px;">
      <div id="agentOutput" class="response-area"></div>
    </div>
    <button style="background: var(--success); margin-top: 15px;" onclick="generatePDF()">تصدير التقرير PDF</button>
  </div>
</div>

<script>
// ضع مفتاح Gemini API المجاني هنا مباشرة
const GEMINI_API_KEY = "ضع_مفتاح_API_المجاني_هنا";

async function runSolarAgent() {
  const userInput = document.getElementById('userPrompt').value.trim();
  const loadingDiv = document.getElementById('loading');
  const outputCard = document.getElementById('outputCard');
  const agentOutput = document.getElementById('agentOutput');

  if (!userInput) {
    alert("يرجى إدخال الأحمال أولاً.");
    return;
  }

  loadingDiv.style.display = "block";
  outputCard.classList.add('hidden');

  const systemInstruction = `
    أنت "YAWAHAB SOLAR AI"، وكيل ذكاء اصطناعي هندسي متخصص في حساب وتصميم منظومات الطاقة الشمسية.
    قم بتحليل طلب العميل وتقديم تقرير هندسي متكامل يحتوي على:
    1. مجموع الأحمال التشغيلية المباشرة (Running Load).
    2. اختيار جهد النظام المناسب (12V / 24V / 48V) وسعة الإنفرتر.
    3. حساب سعة البطاريات المطلوبة (مع الأخذ بالاعتبار عمق التفريغ DoD للثليوم أو الجيل).
    4. حساب عدد وقدرة الألواح الشمسية المطلوبة.
    5. نصائح وتنبيهات هندسية للتركيب والتأريض والحماية.
    اكتب الإجابة بأسلوب هندسي منظم وبنقاط واضحة.
  `;

  try {
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [
          {
            role: 'user',
            parts: [{ text: `${systemInstruction}\n\nطلب العميل:\n${userInput}` }]
          }
        ]
      })
    });

    const data = await response.json();
    loadingDiv.style.display = "none";

    if (data.candidates && data.candidates[0].content.parts[0].text) {
      agentOutput.innerText = data.candidates[0].content.parts[0].text;
      outputCard.classList.remove('hidden');
    } else {
      alert("حدث خطأ في معالجة الطلب، تأكد من صحة API Key.");
    }

  } catch (err) {
    loadingDiv.style.display = "none";
    alert("تعذر الاتصال بالخدمة، تحقق من الاتصال بالإنترنت.");
  }
}

function generatePDF() {
  const element = document.getElementById('pdfPrintArea');
  html2pdf().from(element).save('تقرير_YAWAHAB_SOLAR_AI.pdf');
}
</script>

</body>
</html>
